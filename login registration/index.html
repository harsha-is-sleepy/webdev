<!DOCTYPE html>
<html>
<head>
    <title>Login & Signup</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
        }
        .form-box { 
            border: 1px solid #ccc; 
            padding: 20px; 
            width: 300px; 
            margin-bottom: 20px; 
        }
        input { 
            display: block; 
            margin-top: 5px;
            margin-bottom: 15px; 
            width: 90%; 
            padding: 5px; 
        }
        button { 
            padding: 8px 15px; 
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="form-box">
        <h3>Login</h3>
        <form>
            <label>Email:</label>
            <input type="email" required>
            
            <label>Password:</label>
            <input type="password" required>
            
            <button type="submit">Login</button>
        </form>
    </div>

    <div class="form-box">
        <h3>Register</h3>
        <form>
            <label>Name:</label>
            <input type="text" required>

            <label>Email:</label>
            <input type="email" required>
            
            <label>Password:</label>
            <input type="password" required>
            
            <button type="submit">Sign Up</button>
        </form>
    </div>

</body>
</html>
